name: 'Quality Monitor'
on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/main/java/**'
      - 'src/test/java/**'

permissions:
  contents: write
  packages: write
  statuses: write # To report GitHub Actions status checks
  actions: write # Needed for detection of GitHub Actions environment.
  id-token: write # Needed for provenance signing and ID.
  pull-requests: write

concurrency:
  group: quality-monitor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monitor-quality:
    name: Run Quality Monitor
    runs-on: ubuntu-latest
    steps:
      - name: Action on PR and Branch
        run: |
          echo "The event type is ${{ github.event.action }}"
          echo "Branch name is ${{ github.head_ref }}"

      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          check-latest: true
          cache: maven

      - name: Setup Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.16

      - name: Build with Maven (compile, run tests with coverage & mutation analysis, and static analysis)
        run: mvn -ntp clean verify -Ppit

      - name: Extract Pull Request Number
        uses: jwalton/gh-find-current-pr@v1.3.5
        id: pr

      - name: Run Quality Monitor
        uses: uhafner/quality-monitor@v4.15.0
        if: success() && steps.pr.outputs.pr-number
        with:
          pr-number: ${{ steps.pr.outputs.pr-number }}
          config: >
            {
            	"tests": {
            		"tools": [
            			{ "id": "junit", "name": "Unittests", "pattern": "**/target/*-reports/TEST*.xml" }
            		]
            	},
            	"coverage": [
            		{
            			"name": "JaCoCo",
            			"tools": [
            				{ "id": "jacoco", "metric": "line", "sourcePath": "src/main/java", "pattern": "**/jacoco.xml" },
            				{ "id": "jacoco", "metric": "branch", "sourcePath": "src/main/java", "pattern": "**/jacoco.xml" }
            			]
            		}
            	]
            }
          quality-gates: >
            {
              "qualityGates": [
                { "metric": "line", "threshold": 80.0, "criticality": "FAILURE" },
                { "metric": "checkstyle", "threshold": 70.0, "criticality": "UNSTABLE" }
              ]
            }
          comments-strategy: UPDATE