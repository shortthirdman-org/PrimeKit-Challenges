name: Maven Release Workflow

run-name: Publish Artifacts by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Release version to set in pom (e.g. 1.2.3)'
        required: true
      developmentVersion:
        description: 'Next development version after release (e.g. 1.2.4-SNAPSHOT)'
        required: true
      publishDocs:
        description: 'Publish Maven site documentation to docs/ folder?'
        required: true
        type: boolean
        default: true
      publishRelease:
        description: 'Publish Release Artifacts'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  packages: read
  statuses: write # To report GitHub Actions status checks
  actions: write # Needed for detection of GitHub Actions environment.
  id-token: write # Needed for provenance signing and ID.
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Artifacts
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' && inputs.publishRelease == true }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Maven and Java
        run: |
          java --version
          mvn -version

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set release version in POM
        run: |
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          TARGET_VERSION="${{ github.event.inputs.releaseVersion }}"
          if [ "$CURRENT_VERSION" = "$TARGET_VERSION" ]; then
            echo "POM version is already set to $TARGET_VERSION. Skipping."
          else
            mvn -B versions:set -DnewVersion=$TARGET_VERSION -DgenerateBackupPoms=false
            git add -A
            git commit -m "chore(release): set version $TARGET_VERSION" || echo "No changes to commit"
          fi

      - name: Create and push tag
        run: |
          TAG="v${{ github.event.inputs.releaseVersion }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping tag creation."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin HEAD
            git push origin "$TAG"
          fi

      - name: Build, test and generate reports
        run: mvn -B clean install verify test spotbugs:spotbugs jacoco:report spotbugs:spotbugs-aggregate

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp target/*.jar artifacts/ || true
          [ -d target/reports ] && cp -r target/reports artifacts/ || true
          [ -d target/site/jacoco ] && cp -r target/site/jacoco artifacts/ || true

      - name: Zip reports
        run: |
          cd artifacts
          zip -r reports.zip surefire-reports jacoco || true
          ls -lh

      - name: Generate release notes
        run: |
          TAG="v${{ github.event.inputs.releaseVersion }}"
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -n 1 || true)
          mkdir -p artifacts
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:'- %s (%an)' ${PREV_TAG}..HEAD > artifacts/release-notes.md || true
          else
            git log --pretty=format:'- %s (%an)' -n 50 HEAD > artifacts/release-notes.md || true
          fi
          [ -s artifacts/release-notes.md ] || echo "(No notable commits)" > artifacts/release-notes.md

      - name: Create GitHub Release
        if: ${{ github.event.inputs.releaseVersion != github.event.inputs.developmentVersion }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.releaseVersion }}
          name: Release v${{ github.event.inputs.releaseVersion }}
          body_path: artifacts/release-notes.md
          fail_on_unreleased: false
          generate_release_notes: true
          files: |
            artifacts/*.jar
            artifacts/reports.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump to development version
        run: |
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          DEV_VERSION="${{ github.event.inputs.developmentVersion }}"
          if [ "$CURRENT_VERSION" = "$DEV_VERSION" ]; then
            echo "POM is already at development version $DEV_VERSION. Skipping."
          else
            mvn -B versions:set -DnewVersion=$DEV_VERSION -DgenerateBackupPoms=false
            git add pom.xml
            git commit -m "chore: bump version to $DEV_VERSION" || echo "No changes to commit"
            git push origin HEAD
          fi

      - name: Upload workflow artifacts (optional)
        uses: actions/upload-artifact@v7
        with:
          name: maven-artifacts
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  publish-docs:
    name: Publish Site and API Docs
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' && inputs.publishDocs == true }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      
      - name: Pull and Rebase
        run: |
          git pull --rebase origin main || {
            echo "Merge conflict detected during rebase. Aborting..."
            git rebase --abort
            exit 1
          }

      - name: Build Maven Site
        run: mvn -B site

      - name: Commit and Push Documentation
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update Maven site documentation [skip ci]"
          branch: main
          create_branch: false
          file_pattern: "docs/*"
          commit_user_name: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          commit_user_email: "github-actions[bot]@users.noreply.github.com>"